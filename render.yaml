services:
  - type: web
    name: aroundu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "1"
      - key: SEED_ON_STARTUP
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: aroundu-db
          property: connectionString

databases:
  - name: aroundu-db
    plan: free
    databaseName: aroundu
    user: aroundu
