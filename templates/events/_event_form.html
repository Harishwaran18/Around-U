<form method="POST" action="{{ action_url }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <label for="title">Event title</label>
        <input type="text" id="title" name="title" class="form-control" maxlength="200"
            value="{{ form.get('title', '') }}" placeholder="e.g. Shaastra 2026" required autofocus>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" class="form-control" rows="6"
            placeholder="What happens at the event? Who should apply?" required>{{ form.get('description', '') }}</textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" class="form-control" value="{{ form.get('date', '') }}" required>
        </div>
        <div class="form-group">
            <label for="start_time">Start time <span class="label-optional">optional</span></label>
            <input type="time" id="start_time" name="start_time" class="form-control"
                value="{{ form.get('start_time', '') }}">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control">
                {% for category in categories %}
                <option value="{{ category }}" {% if form.get('category') == category %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="capacity">Capacity <span class="label-optional">optional</span></label>
            <input type="number" id="capacity" name="capacity" class="form-control" min="1"
                value="{{ form.get('capacity', '') }}" placeholder="Leave blank for unlimited">
        </div>
    </div>

    <div class="form-group">
        <label for="host_college">Host college</label>
        <input type="text" id="host_college" name="host_college" class="form-control" list="college-options"
            value="{{ form.get('host_college', '') }}" placeholder="Which campus is hosting?" required>
        <datalist id="college-options">
            {% for college in colleges %}
            <option value="{{ college }}"></option>
            {% endfor %}
        </datalist>
    </div>

    <div class="form-group">
        <label for="location">Venue / address</label>
        <input type="text" id="location" name="location" class="form-control"
            value="{{ form.get('location', '') }}" placeholder="e.g. Main Auditorium, Guindy" required>
    </div>

    <div class="form-group">
        <label for="image_url">Cover image URL <span class="label-optional">optional</span></label>
        <input type="url" id="image_url" name="image_url" class="form-control"
            value="{{ form.get('image_url', '') }}" placeholder="https://example.com/cover.jpg">
        <small class="form-hint">Leave blank to use the default AroundU cover.</small>
    </div>

    <button type="submit" class="btn btn-primary w-full mt-4">{{ submit_label }}</button>
</form>
