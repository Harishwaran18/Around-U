{% from "macros.html" import icon %}
<div class="form-grid">
    <div class="field field--full">
        <label for="title">Event title</label>
        <input class="input" id="title" name="title" maxlength="200" required value="{{ form.title or '' }}"
            placeholder="e.g. Shaastra 2027 — Tech Fest">
        <span class="field-hint">Clear, specific names get more applications.</span>
    </div>

    <div class="field field--full">
        <label for="description">Description</label>
        <textarea class="input textarea" id="description" name="description" rows="6" required
            placeholder="What happens at the event, who should apply, what to bring…">{{ form.description or '' }}</textarea>
    </div>

    <div class="field">
        <label for="date">Date</label>
        <input class="input" type="date" id="date" name="date" required value="{{ form.date or '' }}">
    </div>

    <div class="field">
        <label for="start_time">Start time</label>
        <input class="input" type="time" id="start_time" name="start_time" value="{{ form.start_time or '' }}">
        <span class="field-hint">Optional.</span>
    </div>

    <div class="field">
        <label for="location">Venue</label>
        <input class="input" id="location" name="location" required value="{{ form.location or '' }}"
            placeholder="e.g. IIT Madras Campus, Chennai">
    </div>

    <div class="field">
        <label for="host_college">Host college</label>
        <input class="input" id="host_college" name="host_college" list="college-list" required
            value="{{ form.host_college or '' }}" placeholder="Start typing your college">
        <datalist id="college-list">
            {% for college in colleges %}
            <option value="{{ college }}"></option>
            {% endfor %}
        </datalist>
    </div>

    <div class="field">
        <label for="category">Category</label>
        <div class="select-field">
            <select id="category" name="category" required>
                {% for category in categories %}
                <option value="{{ category }}" {% if form.category == category %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
            {{ icon('chevron-down', 16) }}
        </div>
    </div>

    <div class="field">
        <label for="capacity">Capacity</label>
        <input class="input" type="number" id="capacity" name="capacity" min="1"
            value="{{ form.capacity or '' }}" placeholder="Blank = open entry">
        <span class="field-hint">Leave blank for unlimited seats.</span>
    </div>

    <div class="field field--full">
        <label for="image_url">Cover image URL</label>
        <input class="input" type="url" id="image_url" name="image_url" value="{{ form.image_url or '' }}"
            placeholder="https://images.unsplash.com/…" data-image-input>
        <span class="field-hint">Optional. Wide images (16:9) look best.</span>
        <div class="image-preview" data-image-preview {% if not form.image_url %}hidden{% endif %}>
            <img src="{{ form.image_url or '' }}" alt="Cover preview">
        </div>
    </div>
</div>
