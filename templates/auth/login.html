{% extends "base.html" %}

{% block title %}Login — AroundU{% endblock %}

{% block content %}
<div class="form-container glass">
    <h2 class="text-center mb-8">Welcome back</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com"
                value="{{ form.get('email', '') }}" autocomplete="email" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                autocomplete="current-password" required>
        </div>

        <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Keep me signed in</span>
        </label>

        <button type="submit" class="btn btn-primary w-full mt-4">Sign in</button>
    </form>

    <p class="form-footnote">
        New here? <a href="{{ url_for('auth.register') }}" class="text-accent">Create an account</a>
    </p>
    <p class="form-hint">Demo account: student@demo.com / password123</p>
</div>
{% endblock %}
